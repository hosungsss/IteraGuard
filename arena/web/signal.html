<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IteraGuard · 문자 신호등</title>
  <link rel="stylesheet" href="/signal.css">
  <script src="/signal.js" defer></script>
</head>
<body>
  <main>
    <a class="home" href="/">IteraGuard 홈</a>
    <h1>문자 신호등</h1>
    <form id="check">
      <label for="message">받은 문자</label>
      <p class="hint" id="input-hint">합성 문자나 전화번호·인증번호 등 개인정보를 가린 문자만 넣어 주세요.</p>
      <textarea id="message" aria-describedby="input-hint" maxlength="2000" required
                placeholder="확인할 문자 내용을 붙여넣으세요."></textarea>
      <button id="submit" type="submit">판단하기</button>
    </form>
    <p id="status" role="status"></p>
    <section id="result" aria-live="polite" aria-labelledby="grade" hidden>
      <h2 id="grade"></h2>
      <p><strong>판단 기준</strong> <span id="basis"></span></p>
      <p><strong>대응 방안</strong> <span id="next"></span></p>
    </section>
    <p class="hint scope">조로가 본문만 보고 분류해요. 과거 피싱 문장을 인용한 신고도 위험으로 분류될 수 있어요.</p>
  </main>
</body>
</html>
