<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>의심계 · IteraGuard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/ambient3d.js" defer></script>
  <script src="/visual.js" defer></script>
  <script src="/signal.js" defer></script>
</head>
<body data-signal-only="true">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="ambient3d" class="ambient-3d" aria-hidden="true"></canvas>
  <main>
    <section class="hero">
      <div class="hero-copy">
        <h1>의심스러운 문자,<br>붙여넣고 확인하세요.</h1>
        <p class="lede">피싱 의심 수준과 발신자가 요구하는 행동을 확인해요.</p>
      </div>
      <div class="core" aria-hidden="true">
        <canvas id="coreCanvas" width="360" height="360"></canvas>
      </div>
    </section>

    <form class="composer glass" id="signalForm" aria-labelledby="composerTitle">
      <h2 id="composerTitle" class="sr-only">판단할 문장</h2>
      <label for="text" class="field-label">확인할 문자 또는 이메일 내용</label>
      <p class="composer-privacy" id="pastePrivacy">합성 사례나 전화번호·이름·인증번호 등 개인정보를 가린 문장을 사용해 주세요.</p>
      <textarea id="text" rows="6" maxlength="2000" required aria-describedby="pastePrivacy"
                placeholder="확인할 문장을 붙여넣으세요."></textarea>
      <div class="composer-row">
        <span class="counter" id="charCount">0 / 2000</span>
      </div>
      <div class="composer-foot">
        <button id="run" class="primary" type="submit">판단하기</button>
      </div>
      <p id="sampleNotice" class="hint"></p>
      <p id="signalStatus" class="hint" role="status"></p>
    </form>
    <p><a href="/link-review">링크 평판 따로 확인하기</a></p>

    <section class="verdict glass inline-signal" id="inlineSignal" aria-label="분석 결과" aria-live="polite" hidden>
      <h2 id="inlineSignalGrade" class="inline-signal-grade"></h2>
      <p class="inline-request"><strong>발신자가 지금 뭘 해달라고 하나요?</strong>
        <span id="inlineRequestedAction"></span></p>
      <p id="signalExplanation" class="hint"></p>
    </section>
  </main>
</body>
</html>
