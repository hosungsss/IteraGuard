<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>링크 평판 확인 · 의심계</title><link rel="stylesheet" href="/style.css"><script src="/link-review.js" defer></script></head>
<body><main><section class="composer glass"><a href="/">문자 판단으로 돌아가기</a> · <a href="/arena">상세 분석과 후속 안내</a><h1>링크 평판 확인</h1>
<form id="lookup"><label class="field-label" for="message">합성 또는 비식별 문자</label>
<textarea id="message" required maxlength="2000" rows="4"></textarea>
<label class="field-label" for="host">ScamAdviser에 보낼 도메인 (선택)</label><input id="host" maxlength="253" autocomplete="off" spellcheck="false" placeholder="example.org">
<p>도메인을 비우면 서버에 준비된 PhishTank 목록과 대조합니다. 입력하면 해당 도메인만 ScamAdviser에 보냅니다. 문자 본문과 링크 경로는 로컬에서 처리합니다.</p>
<label><input id="second" type="checkbox"> 조회 자료가 있으면 로컬 Zoro에 보조 의견도 요청</label>
<button id="submitReview" class="primary" type="submit">조회하기</button></form>
<p id="output" role="status" aria-live="polite"></p></section></main></body></html>
